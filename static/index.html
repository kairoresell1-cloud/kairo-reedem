<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Token Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 36px;
    width: 100%;
    max-width: 620px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .logo-n {
    font-family: monospace;
    font-size: 32px;
    font-weight: 900;
    color: #e50914;
    line-height: 1;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }

  .logo-sub {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #555;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    height: 160px;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #999;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: #e50914; color: #fff; }
  textarea::placeholder { color: #444; }

  .or-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
    color: #444;
    font-size: 12px;
  }
  .or-row::before, .or-row::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #2a2a2a;
  }

  .file-drop {
    border: 1px dashed #2a2a2a;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    color: #555;
    font-size: 13px;
  }
  .file-drop:hover, .file-drop.drag { border-color: #e50914; background: #1a0000; color: #fff; }
  .file-drop input { display: none; }

  .btn-generate {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #e50914;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-generate:hover:not(:disabled) { background: #f40612; }
  .btn-generate:disabled { background: #3a0000; color: #666; cursor: not-allowed; }

  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .status.loading { background: #1e1e1e; color: #999; border: 1px solid #2a2a2a; display: block; }
  .status.error   { background: #1a0000; color: #ff4444; border: 1px solid #3a0000; display: block; }
  .status.success { background: #0a1a0a; color: #1db954; border: 1px solid #1a3a1a; display: block; }

  .result-box {
    margin-top: 20px;
    display: none;
  }
  .result-box.show { display: block; }

  .result-url {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: monospace;
    font-size: 11px;
    color: #999;
    word-break: break-all;
    margin-bottom: 10px;
  }

  .btn-row { display: flex; gap: 8px; }

  .btn-copy, .btn-open {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: background .2s;
  }
  .btn-copy { background: #e50914; color: #fff; }
  .btn-copy:hover { background: #f40612; }
  .btn-open { background: #2a2a2a; color: #fff; }
  .btn-open:hover { background: #333; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #444;
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { font-size: 11px; color: #444; margin-top: 8px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="logo-n">N</span>
    <div>
      <div class="logo-text">Token Generator</div>
      <div class="logo-sub">cookies → login link</div>
    </div>
  </div>

  <label>Incolla i tuoi cookie Netflix</label>
  <textarea id="cookieInput" placeholder=".netflix.com&#9;TRUE&#9;/&#9;TRUE&#9;...&#9;NetflixId&#9;xxx&#10;.netflix.com&#9;TRUE&#9;/&#9;TRUE&#9;...&#9;SecureNetflixId&#9;xxx&#10;&#10;oppure: NetflixId=xxx; SecureNetflixId=xxx"></textarea>
  <div class="hint">Formato Netscape (.txt) o raw string con NetflixId e SecureNetflixId</div>

  <div class="or-row">oppure</div>

  <div class="file-drop" id="fileDrop">
    <input type="file" id="fileInput" accept=".txt">
    <div>📁 Trascina il file cookies.txt qui <br><span style="font-size:11px;color:#333">oppure clicca per scegliere</span></div>
  </div>

  <button class="btn-generate" id="btnGenerate">Genera Link</button>

  <div class="status" id="status"></div>

  <div class="result-box" id="resultBox">
    <label style="margin-top:16px">LOGIN LINK — PC / Browser</label>
    <div class="result-url" id="resultUrl"></div>
    <div class="btn-row">
      <button class="btn-copy" id="btnCopy">Copia Link PC</button>
      <button class="btn-open" id="btnOpen">Apri nel Browser</button>
    </div>

    <label style="margin-top:14px">LOGIN LINK — Mobile (App Netflix)</label>
    <div class="result-url" id="resultUrlMobile"></div>
    <div class="btn-row">
      <button class="btn-copy" id="btnCopyMobile">Copia Link Mobile</button>
      <button class="btn-open" id="btnOpenMobile">Apri App Netflix</button>
    </div>

    <div class="hint" style="margin-top:8px">⚠️ Link usa-e-getta — usalo subito dopo aver cliccato Genera</div>
  </div>
</div>

<script>
  const cookieInput = document.getElementById('cookieInput');
  const fileInput   = document.getElementById('fileInput');
  const fileDrop    = document.getElementById('fileDrop');
  const btnGenerate = document.getElementById('btnGenerate');
  const status      = document.getElementById('status');
  const resultBox   = document.getElementById('resultBox');
  const resultUrl   = document.getElementById('resultUrl');
  const btnCopy       = document.getElementById('btnCopy');
  const btnOpen       = document.getElementById('btnOpen');
  const btnCopyMobile = document.getElementById('btnCopyMobile');
  const btnOpenMobile = document.getElementById('btnOpenMobile');
  const resultUrlMobile = document.getElementById('resultUrlMobile');

  let currentUrl = '';
  let currentMobileUrl = '';

  // File drop
  fileDrop.addEventListener('click', () => fileInput.click());
  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag'));
  fileDrop.addEventListener('drop', e => {
    e.preventDefault();
    fileDrop.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  function loadFile(f) {
    const r = new FileReader();
    r.onload = e => { cookieInput.value = e.target.result; fileDrop.querySelector('div').textContent = '✓ ' + f.name; };
    r.readAsText(f);
  }

  // Generate
  btnGenerate.addEventListener('click', async () => {
    const raw = cookieInput.value.trim();
    if (!raw) { setStatus('error', 'Incolla i cookie prima.'); return; }

    btnGenerate.disabled = true;
    resultBox.classList.remove('show');
    setStatus('loading', '<span class="spinner"></span>Generazione in corso...');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookie: raw })
      });
      const data = await res.json();

      if (data.error) {
        setStatus('error', '❌ ' + data.error);
      } else {
        currentUrl = data.url;
        currentMobileUrl = data.mobile_url;
        resultUrl.textContent = data.url;
        resultUrlMobile.textContent = data.mobile_url;
        resultBox.classList.add('show');
        setStatus('success', '✅ Link generato con successo!');
      }
    } catch(e) {
      setStatus('error', '❌ Errore di rete: ' + e.message);
    } finally {
      btnGenerate.disabled = false;
    }
  });

  btnCopy.addEventListener('click', () => {
    navigator.clipboard.writeText(currentUrl);
    btnCopy.textContent = 'Copiato!';
    setTimeout(() => btnCopy.textContent = 'Copia Link PC', 2000);
  });

  btnOpen.addEventListener('click', () => window.open(currentUrl, '_blank'));

  btnCopyMobile.addEventListener('click', () => {
    navigator.clipboard.writeText(currentMobileUrl);
    btnCopyMobile.textContent = 'Copiato!';
    setTimeout(() => btnCopyMobile.textContent = 'Copia Link Mobile', 2000);
  });

  btnOpenMobile.addEventListener('click', () => window.open(currentMobileUrl, '_blank'));

  function setStatus(type, html) {
    status.className = 'status ' + type;
    status.innerHTML = html;
  }
</script>

</body>
</html>
