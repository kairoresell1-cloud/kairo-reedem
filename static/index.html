<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Token Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d; color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px;
  }
  .card {
    background: #161616; border: 1px solid #2a2a2a;
    border-radius: 12px; padding: 36px;
    width: 100%; max-width: 680px; margin-top: 32px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-n { font-family: monospace; font-size: 32px; font-weight: 900; color: #e50914; }
  .logo-text { font-size: 18px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: #555; margin-top: 2px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab {
    padding: 8px 18px; border-radius: 6px; font-size: 13px;
    cursor: pointer; border: none; background: #0d0d0d; color: #555;
    transition: background .2s, color .2s;
  }
  .tab.active { background: #1e1e1e; color: #fff; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  label { display: block; font-size: 11px; font-weight: 700; color: #555;
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }

  textarea {
    width: 100%; height: 140px; background: #1e1e1e;
    border: 1px solid #2a2a2a; border-radius: 8px;
    color: #999; font-family: 'Courier New', monospace; font-size: 12px;
    padding: 12px; resize: vertical; outline: none; transition: border-color .2s;
  }
  textarea:focus { border-color: #e50914; color: #fff; }
  textarea::placeholder { color: #444; }

  .file-drop {
    border: 2px dashed #2a2a2a; border-radius: 8px;
    padding: 28px 20px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s; color: #555; font-size: 13px;
  }
  .file-drop:hover, .file-drop.drag { border-color: #e50914; background: #1a0000; color: #fff; }
  .file-drop input { display: none; }
  .file-list { margin-top: 10px; font-size: 11px; color: #555; line-height: 1.8; }
  .file-list span { display: inline-block; background: #1e1e1e; border-radius: 4px;
    padding: 2px 8px; margin: 2px; color: #999; }

  .btn-generate {
    width: 100%; margin-top: 18px; padding: 14px;
    background: #e50914; border: none; border-radius: 8px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .2s;
  }
  .btn-generate:hover:not(:disabled) { background: #f40612; }
  .btn-generate:disabled { background: #3a0000; color: #666; cursor: not-allowed; }

  .status {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px;
    font-size: 13px; display: none;
  }
  .status.loading { background: #1e1e1e; color: #999; border: 1px solid #2a2a2a; display: block; }
  .status.error   { background: #1a0000; color: #ff4444; border: 1px solid #3a0000; display: block; }
  .status.success { background: #0a1a0a; color: #1db954; border: 1px solid #1a3a1a; display: block; }
  .status.info    { background: #1a1a00; color: #f5a623; border: 1px solid #3a3a00; display: block; }

  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid #444; border-top-color: #e50914;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results { margin-top: 20px; }
  .account-card {
    background: #0d0d0d; border: 1px solid #2a2a2a;
    border-radius: 10px; padding: 18px; margin-bottom: 14px;
  }
  .account-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .account-dot { width: 8px; height: 8px; background: #1db954; border-radius: 50%; flex-shrink: 0; }
  .account-name { font-size: 13px; font-weight: 600; color: #fff; }
  .account-file { font-size: 11px; color: #555; margin-left: auto; }

  .link-row { margin-bottom: 10px; }
  .link-label { font-size: 10px; font-weight: 700; color: #555; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 5px; }
  .link-url {
    background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 8px 10px; font-family: monospace; font-size: 10px;
    color: #777; word-break: break-all; margin-bottom: 6px;
  }
  .btn-row { display: flex; gap: 6px; }
  .btn-sm {
    padding: 6px 12px; border-radius: 6px; font-size: 12px;
    font-weight: 600; cursor: pointer; border: none; transition: background .2s;
  }
  .btn-red  { background: #e50914; color: #fff; }
  .btn-red:hover { background: #f40612; }
  .btn-grey { background: #2a2a2a; color: #fff; }
  .btn-grey:hover { background: #333; }

  .hint { font-size: 11px; color: #444; margin-top: 10px; }
  .progress { font-size: 12px; color: #555; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-n">N</span>
    <div>
      <div class="logo-text">Token Generator</div>
      <div class="logo-sub">multi-account · auto-scan</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('paste')">📋 Incolla</button>
    <button class="tab" onclick="switchTab('files')">📁 File / Cartella</button>
  </div>

  <!-- Paste tab -->
  <div class="tab-panel active" id="tab-paste">
    <label>Incolla cookie (uno o più blocchi)</label>
    <textarea id="cookieInput" placeholder=".netflix.com&#9;TRUE&#9;/&#9;TRUE&#9;...&#9;NetflixId&#9;xxx&#10;.netflix.com&#9;TRUE&#9;/&#9;TRUE&#9;...&#9;SecureNetflixId&#9;xxx&#10;&#10;oppure: NetflixId=xxx; SecureNetflixId=xxx"></textarea>
  </div>

  <!-- Files tab -->
  <div class="tab-panel" id="tab-files">
    <div class="file-drop" id="fileDrop">
      <input type="file" id="fileInput" multiple webkitdirectory>
      <div>📁 Trascina file o <strong>cartella intera</strong> qui<br>
        <span style="font-size:11px;color:#444">oppure clicca per scegliere — accetta qualsiasi file di testo</span>
      </div>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <button class="btn-generate" id="btnGenerate">Genera Link</button>
  <div class="status" id="status"></div>
  <div class="progress" id="progress"></div>
  <div class="results" id="results"></div>
</div>

<script>
  let loadedFiles = []; // {name, content}
  let activeTab = 'paste';

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((b, i) => {
      b.classList.toggle('active', ['paste','files'][i] === tab);
    });
    document.querySelectorAll('.tab-panel').forEach((p, i) => {
      p.classList.toggle('active', ['tab-paste','tab-files'][i] === 'tab-' + tab);
    });
  }

  // File/folder loading
  const fileDrop  = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileList  = document.getElementById('fileList');

  fileDrop.addEventListener('click', () => fileInput.click());
  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag'));
  fileDrop.addEventListener('drop', e => {
    e.preventDefault(); fileDrop.classList.remove('drag');
    loadFromFileList(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => loadFromFileList(fileInput.files));

  function loadFromFileList(files) {
    loadedFiles = [];
    const promises = [];
    for (const f of files) {
      // Skip obvious binaries by size or known extensions — accept everything else
      const ext = f.name.split('.').pop().toLowerCase();
      if (['exe','zip','rar','png','jpg','jpeg','gif','mp4','mp3','pdf'].includes(ext)) continue;
      promises.push(new Promise(res => {
        const r = new FileReader();
        r.onload = e => { loadedFiles.push({ name: f.name, content: e.target.result }); res(); };
        r.onerror = () => res(); // skip unreadable
        r.readAsText(f);
      }));
    }
    Promise.all(promises).then(() => {
      fileList.innerHTML = loadedFiles.map(f => `<span>📄 ${f.name}</span>`).join('');
      if (loadedFiles.length === 0) fileList.innerHTML = '<span style="color:#555">Nessun file .txt/.json trovato</span>';
    });
  }

  // Generate
  document.getElementById('btnGenerate').addEventListener('click', async () => {
    const btn = document.getElementById('btnGenerate');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const results = document.getElementById('results');

    // Build sources list
    let sources = [];
    if (activeTab === 'paste') {
      const raw = document.getElementById('cookieInput').value.trim();
      if (!raw) { setStatus('error', '❌ Incolla i cookie prima.'); return; }
      sources = [{ name: 'input incollato', content: raw }];
    } else {
      if (loadedFiles.length === 0) { setStatus('error', '❌ Carica almeno un file.'); return; }
      sources = loadedFiles;
    }

    btn.disabled = true;
    results.innerHTML = '';
    progress.textContent = '';
    setStatus('loading', '<span class="spinner"></span>Scansione in corso...');

    // Send all sources to backend
    let ok = 0, fail = 0, total = sources.length;

    for (let i = 0; i < sources.length; i++) {
      const src = sources[i];
      progress.textContent = `Elaborazione ${i+1}/${total}: ${src.name}`;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cookie: src.content, source: src.name })
        });
        const data = await res.json();

        if (data.accounts && data.accounts.length > 0) {
          for (const acc of data.accounts) {
            ok++;
            results.innerHTML += renderAccount(acc, src.name);
          }
        } else if (data.error) {
          fail++;
          // Silently skip failed — only show working ones
        }
      } catch(e) {
        fail++;
      }
    }

    progress.textContent = '';
    if (ok === 0) {
      setStatus('error', `❌ Nessun account valido trovato in ${total} file.`);
    } else {
      setStatus('success', `✅ ${ok} account validi trovati${fail > 0 ? ` (${fail} non validi saltati)` : ''}`);
    }

    btn.disabled = false;
  });

  function renderAccount(acc, filename) {
    const id = 'acc_' + Math.random().toString(36).slice(2);
    return `
    <div class="account-card">
      <div class="account-header">
        <div class="account-dot"></div>
        <div class="account-name">Account valido</div>
        <div class="account-file">${filename}</div>
      </div>

      <div class="link-row">
        <div class="link-label">🖥️ PC / Browser</div>
        <div class="link-url" id="${id}_pc">${acc.url}</div>
        <div class="btn-row">
          <button class="btn-sm btn-red" onclick="copyLink('${id}_pc', this)">Copia</button>
          <button class="btn-sm btn-grey" onclick="window.open(document.getElementById('${id}_pc').textContent,'_blank')">Apri</button>
        </div>
      </div>

      <div class="link-row" style="margin-top:12px">
        <div class="link-label">📱 Mobile</div>
        <div class="link-url" id="${id}_mob">${acc.mobile_url}</div>
        <div class="btn-row">
          <button class="btn-sm btn-red" onclick="copyLink('${id}_mob', this)">Copia</button>
          <button class="btn-sm btn-grey" onclick="window.open(document.getElementById('${id}_mob').textContent,'_blank')">Apri</button>
        </div>
      </div>
    </div>`;
  }

  function copyLink(elId, btn) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text);
    const orig = btn.textContent;
    btn.textContent = 'Copiato!';
    setTimeout(() => btn.textContent = orig, 2000);
  }

  function setStatus(type, html) {
    const s = document.getElementById('status');
    s.className = 'status ' + type;
    s.innerHTML = html;
  }
</script>
</body>
</html>
